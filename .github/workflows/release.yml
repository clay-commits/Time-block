name: Release

# A release is cut for the version in manifest.json whenever it doesn't exist
# yet: on any push to main (the normal path), on pushing a version tag, or via
# manual dispatch. The job is idempotent — an existing release is left alone.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (must match manifest.json)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(node -p "require('./manifest.json').version")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches manifest version
        if: steps.tag.outputs.exists == 'false'
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.tag.outputs.exists == 'false'
        run: npm ci

      - name: Typecheck and test
        if: steps.tag.outputs.exists == 'false'
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/serializer.test.ts tests/block.test.ts tests/rollover.test.ts tests/slots.test.ts tests/debounce.test.ts

      - name: Build
        if: steps.tag.outputs.exists == 'false'
        run: node esbuild.config.mjs production

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" main.js manifest.json styles.css \
            --title "$TAG" \
            --notes "Timeblock Daily $TAG — install via BRAT with clay-commits/time-block." \
            --target "$GITHUB_SHA"
